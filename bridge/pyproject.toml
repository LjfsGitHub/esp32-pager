[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pager-bridge"
version = "0.1.0"
description = "Pager G1 PC bridge: Web UI + device WSS + ACP agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "websockets>=12",
  "cryptography>=42",
  "zeroconf>=0.132",
  "pywin32>=308",
  "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["httpx>=0.27"]
stt = ["faster-whisper>=1.0"]

[tool.setuptools]
package-dir = { "pager_bridge" = "." }
packages = ["pager_bridge"]
